server:
  assets-path: /app/assets
# Colours are set explicitly in custom.css, because Glance derives every text
# colour from the background and that derivation cannot reach the palette this
# uses (see the header comment in assets/custom.css). What is left here still
# matters for two reasons: `light:` is what puts data-scheme on <html>, which
# is the hook the stylesheet keys off; and --bgh/--bgs/--bgl feed the few
# inline hsl() calls Glance emits, so they are kept equal to the real page
# colour -- 60 13 95 is #f5f5f2, 223 14 10 is #16181d.
theme:
  light: true
  background-color: 60 13 95
  primary-color: 175 77 26
  positive-color: 163 88 20
  negative-color: 345 83 41
  custom-css-file: /assets/custom.css
  presets:
    paper:
      light: true
      background-color: 60 13 95
      primary-color: 175 77 26
      positive-color: 163 88 20
      negative-color: 345 83 41
    ink:
      background-color: 223 14 10
      primary-color: 172 66 50
      positive-color: 156 72 67
      negative-color: 351 95 71
pages:
- name: Home
  columns:
  - size: small
    widgets:
    - type: clock
      hour-format: 12h
      timezones:
      - timezone: Etc/UTC
        label: Local
    - type: weather
      # Swap in your own city.
      location: Amsterdam, Netherlands
      units: imperial
      hour-format: 12h
    - type: calendar
      first-day-of-week: monday
  - size: full
    widgets:
    - type: custom-api
      title: ''
      cache: 20s
      url: http://gpu-exporter:8000/health.json
      template: "{{ if not (.JSON.Bool \"ok\") }}\n<div class=\"signal-ribbon signal-ribbon--unknown\">\n  <div class=\"signal-ribbon__state\"\
        >Status unavailable</div>\n  <div class=\"signal-ribbon__meta\">{{ .JSON.String \"error\" }}</div>\n</div>\n{{ else\
        \ if gt (.JSON.Int \"down\") 0 }}\n<div class=\"signal-ribbon signal-ribbon--down\">\n  <div class=\"signal-ribbon__state\"\
        >{{ .JSON.String \"down_first\" }} down</div>\n  <div class=\"signal-ribbon__meta\">\n    <b>{{ .JSON.Int \"up\" }}/{{\
        \ .JSON.Int \"total\" }}</b> up\n    &nbsp;·&nbsp; {{ .JSON.Int \"down\" }} failing\n    &nbsp;·&nbsp; <b>{{ printf\
        \ \"%.2f\" (.JSON.Float \"uptime_24h\") }}%</b> / 24h\n  </div>\n</div>\n{{ else }}\n<div class=\"signal-ribbon\"\
        >\n  <div class=\"signal-ribbon__state\">All systems nominal</div>\n  <div class=\"signal-ribbon__meta\">\n    <b>{{\
        \ .JSON.Int \"up\" }}/{{ .JSON.Int \"total\" }}</b> up\n    &nbsp;·&nbsp; <b>{{ printf \"%.2f\" (.JSON.Float \"uptime_24h\"\
        ) }}%</b> / 24h\n  </div>\n</div>\n{{ end }}"
    - type: search
      bangs:
      - title: Google
        shortcut: '!g'
        url: https://www.google.com/search?q={QUERY}
      - title: GitHub
        shortcut: '!gh'
        url: https://github.com/search?q={QUERY}
      - title: Reddit
        shortcut: '!r'
        url: https://www.reddit.com/search?q={QUERY}
      - title: YouTube
        shortcut: '!yt'
        url: https://www.youtube.com/results?search_query={QUERY}
    - type: videos
