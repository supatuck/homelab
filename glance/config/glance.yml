- name: System
  columns:
  - size: small
    widgets:
    - type: server-stats
      servers:
      - type: local
        name: docker-host
    - type: custom-api
      title: GPU · Intel Arc B580
      cache: 15s
      url: http://gpu-exporter:8000/gpu.json
      template: "<div class=\"flex justify-between text-center\">\n  <div>\n    <div class=\"color-highlight size-h3\">{{\
        \ if .JSON.Bool \"gpu_util_available\" }}{{ printf \"%.0f\" (.JSON.Float \"gpu_util_pct\") }}%{{ else }}n/a{{ end\
        \ }}</div>\n    <div class=\"size-h6\">BUSY</div>\n  </div>\n  <div>\n    <div class=\"color-highlight size-h3\">{{\
        \ printf \"%.0f\" (.JSON.Float \"temp_c\") }}°</div>\n    <div class=\"size-h6\">TEMP</div>\n  </div>\n  <div>\n \
        \   <div class=\"color-highlight size-h3\">{{ printf \"%.1f\" (.JSON.Float \"mem_used_gb\") }}G</div>\n    <div class=\"\
        size-h6\">VRAM</div>\n  </div>\n  <div>\n    <div class=\"color-highlight size-h3\">{{ printf \"%.0f\" (.JSON.Float\
        \ \"clock_mhz\") }}</div>\n    <div class=\"size-h6\">MHZ</div>\n  </div>\n</div>\n<div class=\"size-h6 margin-top-10\"\
        >\n  {{ if .JSON.Bool \"gpu_util_available\" }}decode {{ printf \"%.0f\" (.JSON.Float \"engines.video_decode\") }}%\
        \ ·\n  render {{ printf \"%.0f\" (.JSON.Float \"engines.render\") }}% ·\n  {{ end }}fan {{ printf \"%.0f\" (.JSON.Float\
        \ \"fan_rpm\") }}rpm\n</div>\n"
    - type: releases
      cache: 1d
      token: ${GITHUB_TOKEN}
      repositories:
      - glanceapp/glance
      - go-gitea/gitea
      - immich-app/immich
      - syncthing/syncthing
  - size: full
    widgets:
    - type: custom-api
